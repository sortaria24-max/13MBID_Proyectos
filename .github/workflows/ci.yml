name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Configurar acceso a DagsHub (DVC)
        run: |
          uv run dvc remote modify origin --local auth basic
          uv run dvc remote modify origin --local user ${{ secrets.DAGSHUB_USER }}
          uv run dvc remote modify origin --local password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Descargar datos, modelo y métricas
        run: uv run dvc pull data/processed/datos_integrados.csv models/trained_model.pkl metrics/train_metrics.json